name: validate

on:
  push:
    paths:
      - "SKILL.md"
      - "references/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema pyyaml

      - name: Validate schema is well-formed JSON
        run: python -c "import json; json.load(open('references/schema.json', encoding='utf-8')); print('schema.json OK')"

      - name: Validate every worked example against the schema
        run: python scripts/validate.py
